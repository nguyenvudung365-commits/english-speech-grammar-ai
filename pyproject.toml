[project]
name = "english-speech-grammar-local"
version = "0.1.0"
description = "Local vertical slice with explicitly fake language adapters"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "argon2-cffi>=23,<26",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
browser = ["playwright>=1.58,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: real PostgreSQL integration (never substituted with SQLite)"]

[tool.ruff]
line-length = 100
target-version = "py312"
